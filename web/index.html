<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload e compressão de imagens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    main { width: 100%; max-width: 760px; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .subtitle { color: #8b8f98; margin-bottom: 32px; }
    .upload {
      display: flex; gap: 12px; align-items: center;
      background: #171a21; border: 1px solid #262a33;
      border-radius: 12px; padding: 16px;
    }
    input[type="file"] { flex: 1; color: #8b8f98; }
    button {
      background: #3b82f6; color: white; border: none;
      padding: 10px 20px; border-radius: 8px;
      font-size: 14px; cursor: pointer;
    }
    button:disabled { background: #2a3140; cursor: not-allowed; }
    #status { margin: 24px 0 8px; font-size: 15px; }
    #status.error { color: #f87171; }
    #status.done { color: #4ade80; }
    #original { color: #8b8f98; margin-bottom: 20px; }
    .variants {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .card {
      background: #171a21; border: 1px solid #262a33;
      border-radius: 12px; overflow: hidden;
    }
    .card img {
      width: 100%; height: 160px; object-fit: cover;
      display: block; background: #0b0d10;
    }
    .card .info { padding: 12px; font-size: 14px; }
    .card .name { font-weight: 600; margin-bottom: 4px; }
    .card .meta { color: #8b8f98; }
    .card .saving { color: #4ade80; margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Upload e compressão de imagens</h1>
    <p class="subtitle">Envie uma imagem JPG, PNG ou WebP (até 20 MB)</p>

    <div class="upload">
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" />
      <button id="send">Upload</button>
    </div>

    <p id="status"></p>
    <p id="original"></p>
    <div class="variants" id="variants"></div>
  </main>

  <script>
    const fileInput = document.getElementById('file')
    const sendButton = document.getElementById('send')
    const statusEl = document.getElementById('status')
    const originalEl = document.getElementById('original')
    const variantsEl = document.getElementById('variants')

    const STATUS_TEXT = {
      AWAITING_UPLOAD: 'Aguardando envio...',
      PENDING: 'Na fila...',
      PROCESSING: 'Processando...',
      DONE: 'Pronto!',
      FAILED: 'Falhou',
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`
      return `${(bytes / 1024 / 1024).toFixed(2)} MB`
    }

    function setStatus(text, type = '') {
      statusEl.textContent = text
      statusEl.className = type
    }

    async function api(url, options) {
      const response = await fetch(url, options)
      const data = await response.json().catch(() => ({}))
      if (!response.ok) throw new Error(data.message || 'Erro na requisição')
      return data
    }

    sendButton.addEventListener('click', async () => {
      const file = fileInput.files[0]
      if (!file) return setStatus('Escolha uma imagem primeiro', 'error')

      sendButton.disabled = true
      originalEl.textContent = ''
      variantsEl.innerHTML = ''

      try {
        // 1. Pede o link de upload pra API
        setStatus('Gerando link de upload...')
        const { id, url, fields } = await api('/images/upload-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            filename: file.name,
            contentType: file.type,
            size: file.size,
          }),
        })

        // 2. Envia o arquivo direto pro MinIO
        setStatus('Enviando imagem...')
        const form = new FormData()
        Object.entries(fields).forEach(([key, value]) => form.append(key, value))
        form.append('file', file) // o arquivo precisa ser o último campo

        const upload = await fetch(url, { method: 'POST', body: form })
        if (!upload.ok) throw new Error('O armazenamento recusou o arquivo')

        // 3. Avisa a API que terminou
        await api(`/images/${id}/complete`, { method: 'POST' })

        // 4. Pergunta a cada 1s se ficou pronta
        await waitUntilReady(id)
      } catch (error) {
        setStatus(error.message, 'error')
      } finally {
        sendButton.disabled = false
      }
    })

    async function waitUntilReady(id) {
      while (true) {
        const image = await api(`/images/${id}`)
        setStatus(STATUS_TEXT[image.status] || image.status)

        if (image.status === 'DONE') {
          setStatus('Pronto!', 'done')
          return showResult(image)
        }
        if (image.status === 'FAILED') {
          throw new Error(`Falhou: ${image.error}`)
        }

        await new Promise((resolve) => setTimeout(resolve, 1000))
      }
    }

    function showResult(image) {
      originalEl.textContent = `Original: ${image.originalName} — ${formatBytes(image.originalSize)}`

      variantsEl.innerHTML = image.variants.map((variant) => {
        const saving = 100 - (variant.size / image.originalSize) * 100
        return `
          <div class="card">
            <a href="${variant.url}" target="_blank">
              <img src="${variant.url}" alt="${variant.name}" />
            </a>
            <div class="info">
              <div class="name">${variant.name}</div>
              <div class="meta">${variant.width}px · ${formatBytes(variant.size)}</div>
              <div class="saving">${saving.toFixed(1)}% menor</div>
            </div>
          </div>
        `
      }).join('')
    }
  </script>
</body>
</html>
