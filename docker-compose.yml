services:
  postgres:
    image: postgres:17-alpine
    container_name: upload-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: upload-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    # MinIO saiu do Docker Hub e do Quay; RustFS e compativel com a API S3
    image: rustfs/rustfs:latest
    container_name: upload-minio
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3333}   # o navegador envia a imagem direto para ca
    ports:
      - "9000:9000"   # API do S3
      - "9001:9001"   # painel web
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata: